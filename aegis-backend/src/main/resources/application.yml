spring:
  application:
    name: aegis-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aegis}
    username: ${SPRING_DATASOURCE_USERNAME:aegis}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  neo4j:
    uri: ${SPRING_NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:}
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

aegis:
  minio:
    endpoint: ${AEGIS_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${AEGIS_MINIO_ACCESS_KEY:aegis_minio}
    secret-key: ${AEGIS_MINIO_SECRET_KEY:}
    bucket-name: ${AEGIS_MINIO_BUCKET:aegis-sboms}
  jwt:
    secret: ${AEGIS_JWT_SECRET:}
    expiration: ${AEGIS_JWT_EXPIRATION:86400000} # 1 day

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    org.springframework.security: INFO
    org.flywaydb: INFO
