<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:replace="${title}">AEGIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/aegis.css}"/>
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <div class="brand">AEGIS</div>
        <div class="brand-sub">Software supply-chain security</div>
        <nav class="nav">
            <a th:href="@{/web/dashboard}" th:classappend="${activeNav == 'dashboard'} ? ' active'">Dashboard</a>
            <a th:href="@{/web/organizations}" th:classappend="${activeNav == 'organizations'} ? ' active'">Organizations</a>
            <a th:href="@{/web/api-keys}" th:classappend="${activeNav == 'api-keys'} ? ' active'">API Keys</a>
            <a th:href="@{/logout}">Logout</a>
        </nav>
    </aside>
    <main class="main">
        <div th:replace="${content}">Content</div>
    </main>
</div>
</body>
</html>
