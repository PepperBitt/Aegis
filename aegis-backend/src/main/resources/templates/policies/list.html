<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Policies · AEGIS</title>
</head>
<body>
<section>
    <div class="topbar">
        <h1 th:text="${project.name + ' — Policies'}">Policies</h1>
        <div class="user-meta" th:text="${user.email}">user</div>
    </div>
    <div class="project-nav" th:replace="~{fragments/project-nav :: projectNav(${project}, ${activeNav})}"></div>
    <div class="panel" th:if="${evaluation != null}">
        <p>
            Latest evaluation:
            <strong th:text="${evaluation.overallPassed} ? 'PASS' : 'FAIL'">PASS</strong>
        </p>
    </div>
    <div class="panel">
        <p class="muted" th:if="${message != null}" th:text="${message}">Policy engine not available.</p>
        <table class="table" th:if="${policies != null and !policies.isEmpty()}">
            <thead><tr><th>Name</th><th>Type</th><th>Enabled</th></tr></thead>
            <tbody>
            <tr th:each="p : ${policies}">
                <td th:text="${p.name}">policy</td>
                <td th:text="${p.policyType}">type</td>
                <td th:text="${p.enabled}">true</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
